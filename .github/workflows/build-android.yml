name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Also publish a GitHub Release with this tag (e.g. v0.1.0). It must match
          "v" + package.json version. Leave empty for a plain build.
        required: false
        default: ''

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Release APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Needed only by the tag-triggered GitHub Release step.
      contents: write
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licences accepted); the Android
      # Gradle plugin fetches any missing platform/build-tools itself. android-actions/setup-android
      # is not used: it installs the legacy `tools` package, which Google removed from the SDK repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # CNG: android/ is generated here and never committed (it is gitignored).
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # The Expo template's `release` build type signs with the debug keystore
      # (signingConfigs.debug). The APK installs on any device but cannot go to Google Play
      # and cannot update a build signed with a different key. See README "Builds" for a
      # real keystore (EAS credentials or Gradle signing via secrets).
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the requested release tag matches package.json
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ inputs.release_tag }}" != "v${VERSION}" ]; then
            echo "::error::release_tag '${{ inputs.release_tag }}' does not match package.json version v${VERSION}"
            exit 1
          fi

      # Release asset name: tumblr-gallery-v<package.json version>.apk
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/release
          cp android/app/build/outputs/apk/release/app-release.apk "dist/release/tumblr-gallery-v${VERSION}.apk"
          ls -l dist/release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumblr-gallery-apk
          path: dist/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runs for pushed v* tags, or for a manual run with release_tag set (the action then
      # creates that tag at this commit).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  eas:
    name: EAS preview build (optional)
    # Opt in with the repository variable EAS_BUILD_ENABLED=true and the EXPO_TOKEN secret.
    if: ${{ vars.EAS_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Queues the build on EAS and exits; the APK appears on expo.dev when it finishes.
      - name: Start EAS build
        run: eas build --platform android --profile preview --non-interactive --no-wait
