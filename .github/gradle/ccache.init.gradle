// Gradle init script (CI only): route every CMake compile and link through ccache.
//
// React Native's own ReactNative-application.cmake already uses ccache when the binary is on
// PATH, which covers the app module. The native libraries (expo-modules-core, worklets,
// nitro-modules, reanimated, screens, mmkv, ...) run their own CMake projects; all of them
// *append* their CMake arguments, so adding the launcher flags after evaluation reaches
// each of them. Passed with: ./gradlew -I <this file> ...
gradle.projectsEvaluated {
    def launcher = [
        '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
        '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache',
    ]
    allprojects { project ->
        def android = project.extensions.findByName('android')
        if (android == null) return
        try {
            android.defaultConfig.externalNativeBuild.cmake.arguments.addAll(launcher)
            project.logger.lifecycle("ccache: enabled for ${project.path}")
        } catch (Exception e) {
            project.logger.warn("ccache: could not configure ${project.path}: ${e.message}")
        }
    }
}
